name: Build und Deploy

# Prüfen: jeder Pull Request (auch von Renovate) und jeder Push auf main – mit allen Guard-Gates, in parallelen Jobs.
# Veröffentlichen: nur Pushes auf main, in einem eigenen Job über GitHub Pages (Quelle „GitHub Actions“, kein gh-pages-Branch).
# Lokal dieselben Schritte und Playwright-Projekte, nur nacheinander in einem Container: npm run gates:ci (scripts/ci-local.sh)
on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'CLAUDE.md'
      - 'docs/**'
  pull_request:
  workflow_dispatch:

# Pull Requests: ein neuer Push bricht den alten Lauf ab. Auf main bekommt jeder Push sein eigenes Urteil (eigene Gruppe
# je Lauf, nie abgebrochen oder verdrängt); dass kein älterer Lauf einen neueren Stand überschreibt, prüft der Deploy-Job.
concurrency:
  group: gates-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions sind auf Commit-SHAs gepinnt (Tags lassen sich umhängen); Renovate hält die SHAs aktuell.
# Standard: nur lesen. Install-Skripte frisch aktualisierter Pakete (Renovate) laufen damit ohne Schreib-Token.
permissions:
  contents: read

# Fristen je Job: etwa das 2,5-Fache der Dauer auf 2 CPUs (npm run gates:ci) samt geschätztem Einrichten (Checkout und
# npm ci etwa 1 min, Browser samt Systempaketen etwa 1,5 min). Gemessen: static 19 s, deep 152 s, coverage 238 s (27.11.2026), build und verify
# wenige Sekunden, e2e-site 9 s, e2e-game 20 s und 119 s. Reißt eine, erst die Ursache suchen; anheben nur mit
# Begründung in der Commit-Nachricht.
jobs:
  static:
    name: Format, Lint, Architektur, Typen
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Guard-Gate – Formatierung (Prettier)
        run: npm run format:check

      - name: Guard-Gate – Lint (ESLint)
        run: npm run lint

      - name: Guard-Gate – Architekturregeln (dependency-cruiser)
        run: npm run arch

      - name: Guard-Gate – Typen und Inhalte prüfen
        run: npm run check

  # Eigenschafts-Tests über ihre vollen Seed-Bereiche (MITWACHSEN_DEEP=1, test-worlds.ts), ohne Abdeckung (die misst der
  # Job coverage parallel): Ein Fehler der Welt-Erzeugung, den nur manche Seeds zeigen, hält so jeden Pull Request und
  # jeden Deploy auf. Eigener Job seit 27.11.2026 (#11): Im Job static stieß der Lauf an dessen 5 Minuten (gates:ci 139
  # bis 152 s von erlaubten 150 s). Er liegt neben build und den Browser-Tests, nicht auf dem längsten Weg
  deep:
    name: Unit-Tests über alle Seeds
    runs-on: ubuntu-latest
    # 152 s in gates:ci × 2,5 + 1 min Einrichten
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Guard-Gate – Unit-Tests über alle Seeds
        run: npm run test:deep

  coverage:
    name: Unit-Tests mit Abdeckung
    runs-on: ubuntu-latest
    # 238 s in gates:ci × 2,5 + 1 min Einrichten; auf dem Runner zuletzt 217 bis 365 s
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Guard-Gate – Unit-Tests mit Mindest-Abdeckung
        run: npm test

  build:
    name: Build und fertige Seite prüfen
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Build
        run: npm run build

      - name: Guard-Gate – Fertige Seite (HTML, Links, Bundles, externe Ressourcen, App)
        run: npm run verify

      # Für die Browser-Tests: dieselbe Seite, kein zweiter Build (e2e/serve.ts liefert dist/, e2e/versions.ts leitet
      # daraus Fassung 2 ab)
      - name: Fertige Seite für die Browser-Tests bereitstellen
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

      - name: Fertige Seite für den Deploy-Job bereitstellen
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/
          retention-days: 1

  # Browser-Tests: je Job ein Blob-Bericht, e2e-merge führt sie zu einem Bericht zusammen. Browser werden nicht
  # zwischengespeichert: Chromium lädt etwa so schnell, wie ein Cache sich zurückholt, und die Systempakete (--with-deps)
  # kommen ohnehin jedes Mal per apt.
  e2e-site:
    name: Browser-Tests – Seiten ohne Spiel
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Fertige Seite holen
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Browser installieren
        run: npx playwright install --with-deps chromium

      - name: Guard-Gate – Browser-Tests (Projekt site)
        run: npx playwright test --project=site --reporter=github,blob
        env:
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-site.zip

      - name: Blob-Bericht hochladen
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-report-site
          path: blob-report/
          if-no-files-found: ignore
          retention-days: 1

  # Spiel in 2D: Spiel-Tests (`game`, 2 Worker) und App-Updates (`pwa-update`, ein Worker, echte Uhr) nebeneinander,
  # gemessen auf 2 CPUs (gates:ci) 128 s. Neues Projekt in playwright.config.ts: hier, bei e2e-3d oder bei
  # e2e-site eintragen, sonst läuft es in der Pipeline nicht.
  e2e-game:
    name: Browser-Tests – Spiel
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Fertige Seite holen
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Browser installieren
        run: npx playwright install --with-deps chromium

      - name: Guard-Gate – Browser-Tests (Projekte game, pwa-update)
        run: npx playwright test --project=game --project=pwa-update --reporter=github,blob
        env:
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-game.zip

      - name: Blob-Bericht hochladen
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-report-game
          path: blob-report/
          if-no-files-found: ignore
          retention-days: 1

  # Spiel in 3D (Software-WebGL): `3d` und `pwa-update-3d` laufen je mit einem Worker. Playwright teilt nach Zahl der
  # Tests: Teil 1 bekommt nur `3d`, Teil 2 den Rest von `3d` neben `pwa-update-3d`; gemessen auf 2 CPUs (gates:ci) 81 s
  # und 126 s. Eigener Job seit den feinen Flächen (Issue 13): Bis 27.11.2026 lief alles Spiel in zwei Teilen von
  # e2e-game (vorher gemessen 20 s und 119 s, mit den feinen Flächen 64 s und 236 s, `3d` allein 225 s).
  e2e-3d:
    name: Browser-Tests – Spiel in 3D ${{ matrix.shard }}/2
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Fertige Seite holen
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Browser installieren
        run: npx playwright install --with-deps chromium

      - name: Guard-Gate – Browser-Tests (Projekte 3d, pwa-update-3d)
        run: >-
          npx playwright test --project=3d --project=pwa-update-3d --shard=${{ matrix.shard }}/2
          --reporter=github,blob
        env:
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-3d-${{ matrix.shard }}.zip

      - name: Blob-Bericht hochladen
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-report-3d-${{ matrix.shard }}
          path: blob-report/
          if-no-files-found: ignore
          retention-days: 1

  # Kein Gate: ein Bericht für alle Browser-Tests, auch nach Rot (npx playwright show-report, mit Traces der
  # gescheiterten Versuche), und wackelige Tests in die Zusammenfassung des Laufs
  e2e-merge:
    name: Bericht der Browser-Tests
    needs: [build, e2e-site, e2e-game, e2e-3d]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Blob-Berichte holen
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blob-report-*
          path: blob-report/
          merge-multiple: true

      - name: Berichte zusammenführen (HTML und JSON)
        run: npx playwright merge-reports --reporter=html,json blob-report/
        env:
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/report.json

      - name: Bericht der Browser-Tests hochladen
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Wackelige Browser-Tests in die Zusammenfassung
        run: node scripts/flaky-summary.ts

  # Ein einziger Pflicht-Check für das Ruleset „protect main“ (und damit für Renovates Automerge): grün nur, wenn alle
  # Gates grün sind. Läuft immer (auch wenn ein Gate rot ist oder abgebrochen wurde), damit der Check nie fehlt;
  # übersprungen zählt als rot. Neue Gate-Jobs hier unter needs eintragen.
  guard-gates:
    name: Guard-Gates
    needs: [static, deep, coverage, build, e2e-site, e2e-game, e2e-3d]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Alle Gates grün?
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Ergebnisse: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error title=Guard-Gates::Mindestens ein Gate ist nicht grün ($r)"
              exit 1
            fi
          done

  deploy:
    name: Deploy auf GitHub Pages
    needs: [guard-gates]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Nur dieser Job darf veröffentlichen – ohne Schreibrechte aufs Repo. Er baut nichts und installiert nichts.
    # contents: read nur für die Frage, ob main inzwischen weiter ist.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Deploys nie abbrechen, nacheinander ausführen
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      # Läufe auf main laufen parallel: Ein älterer, langsamerer Lauf darf den Stand eines neueren nicht überschreiben.
      # Übersprungen wird nur, wenn ein neuerer Commit mehr als Doku ändert – nur dann hat er einen eigenen Lauf
      # (paths-ignore oben), der veröffentlicht.
      - name: Nur den neuesten Stand von main veröffentlichen
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          head=$(gh api "repos/$REPO/commits/main" --jq .sha)
          files=$(gh api "repos/$REPO/compare/$GITHUB_SHA...$head" --jq '.files[].filename')
          newer=$(echo "$files" | grep -Ev '^(README\.md|CLAUDE\.md|docs/.*)?$' || true)
          if [ "$head" = "$GITHUB_SHA" ] || [ -z "$newer" ]; then
            echo "newest=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Deploy übersprungen::main ist schon bei $head, dessen Lauf veröffentlicht"
            echo "newest=false" >> "$GITHUB_OUTPUT"
          fi

      - id: deployment
        if: steps.latest.outputs.newest == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
